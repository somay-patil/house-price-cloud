<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House price estimator</title>
<style>
  :root{
    --paper:#eef1ee; --ink:#1c2a26; --muted:#5d6f69; --line:#c9d2cd;
    --field:#ffffff; --accent:#1f5d50; --accent-ink:#ffffff; --err:#a3341f;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#121a18;--ink:#e6ede9;--muted:#93a69f;--line:#2c3b37;--field:#1a2522;--accent:#6fcab5;--accent-ink:#0c1512;--err:#f08a74}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
  main{max-width:880px;margin:0 auto;padding:40px 20px 64px;display:grid;gap:40px;grid-template-columns:1fr}
  @media(min-width:760px){main{grid-template-columns:1fr 1fr;align-items:start;padding-top:72px}}
  h1{font:600 clamp(2rem,5vw,3rem)/1.08 Georgia,"Times New Roman",serif;margin:0 0 12px;letter-spacing:-.01em}
  p.lead{color:var(--muted);margin:0;max-width:34ch}
  form{display:grid;gap:16px}
  label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
  input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button{font:inherit;font-weight:600;padding:13px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button[disabled]{opacity:.6;cursor:wait}
  #result{margin-top:4px;min-height:5.5rem}
  #price{font:600 2.6rem/1.1 Georgia,serif;display:block}
  #note{color:var(--muted);font-size:.9rem}
  #note.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <section>
    <h1>What is this house worth?</h1>
    <p class="lead">Enter the basics and the model, running in the cloud, returns an estimated price.</p>
  </section>
  <section>
    <form id="f">
      <label>Area (sq ft)<input name="area_sqft" type="number" min="300" max="19000" value="1800" required></label>
      <div class="pair">
        <label>Bedrooms<input name="bedrooms" type="number" min="1" max="10" value="3" required></label>
        <label>Bathrooms<input name="bathrooms" type="number" min="1" max="10" value="2" required></label>
      </div>
      <label>Age of house (years)<input name="age_years" type="number" min="0" max="200" value="10" required></label>
      <label>Location
        <select name="location" id="loc"></select>
      </label>
      <button id="go" type="submit">Estimate price</button>
      <div id="result" aria-live="polite"><span id="price"></span><span id="note">Fill in the details and select Estimate price.</span></div>
    </form>
  </section>
</main>
<script>
const f=document.getElementById('f'),price=document.getElementById('price'),note=document.getElementById('note'),go=document.getElementById('go'),loc=document.getElementById('loc');
fetch('/info').then(r=>r.json()).then(d=>{
  const list=(d.metrics&&d.metrics.locations)||['Downtown','Suburb','Rural','Waterfront'];
  loc.innerHTML=list.map(l=>`<option>${l}</option>`).join('');
  if(d.metrics&&d.metrics.r2!==undefined) note.textContent=`Model accuracy on test data: R² ${d.metrics.r2}. Fill in the details and select Estimate price.`;
}).catch(()=>{loc.innerHTML='<option>Downtown</option><option>Suburb</option><option>Rural</option><option>Waterfront</option>'});
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f));
  ['area_sqft','bedrooms','bathrooms','age_years'].forEach(k=>d[k]=Number(d[k]));
  go.disabled=true;price.textContent='';note.className='';note.textContent='Estimating…';
  try{
    const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    const j=await r.json();
    if(!r.ok) throw new Error(typeof j.detail==='string'?j.detail:'Check that every field is within range.');
    price.textContent='$'+Math.round(j.predicted_price).toLocaleString('en-US');
    note.textContent='Estimated sale price';
  }catch(err){note.className='err';note.textContent=err.message||'Could not reach the server. Try again.'}
  go.disabled=false;
});
</script>
</body>
</html>
